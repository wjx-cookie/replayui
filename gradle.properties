# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
loader_version=0.16.14
loom_version=1.17.21
fabric_api_version=0.116.4+1.21.1

# Flashback: any version works, drop the jar in libs/ as flashback-*.jar.
# The build matches by wildcard, so no version number is needed here.
# 0.39.9 is the one built for MC 1.21.1; see libs/README.txt.

# Mod Properties
mod_version=0.1.0
# Reverse of the hosting namespace. No custom domain, so GitHub's is used.
maven_group=io.github.wjx-cookie
archives_base_name=replayui
